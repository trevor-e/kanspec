name: Rust

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Make Git Bash available to hook tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH 'C:\Program Files\Git\bin'
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Test
        run: cargo test --locked
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build Windows executables
        if: runner.os == 'Windows'
        run: cargo build --locked --release --bins
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: kanspec-windows-x86_64
          path: |
            target/release/kanspec.exe
            target/release/ks.exe
